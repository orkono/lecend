[package]
name = "lecend"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
exclude = [".superpowers/", "docs/superpowers/", "plugin/", ".github/", "scripts/"]
description = "Captures the short labels of a long Claude Code session (W6, OLD, NEW) into a local glossary you can look up without the model"
repository = "https://github.com/orkono/lecend"
homepage = "https://github.com/orkono/lecend"
readme = "README.md"
keywords = ["claude-code", "glossary", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
