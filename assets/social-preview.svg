<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#17143A"/>
  <svg x="96" y="180" width="280" height="280" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1B4D"/>
      <stop offset="1" stop-color="#3B2F8F"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a legend: each short label keyed to its meaning -->
  <g transform="translate(0 8)">
  <!-- row 1, the label looked up: an amber tag and its definition -->
  <rect x="80" y="112" width="352" height="104" rx="28" fill="#FFFFFF" opacity="0.08"/>
  <path d="M 104 140 H 172 L 200 164 L 172 188 H 104 Q 96 188 96 180 V 148 Q 96 140 104 140 Z"
        fill="url(#tag)" stroke="url(#tag)" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="122" cy="164" r="8" fill="#1F1B4D"/>
  <rect x="228" y="148" width="180" height="32" rx="16" fill="#FFFFFF"/>

  <!-- rows 2 and 3: keys and their definitions -->
  <rect x="100" y="256" width="72" height="44" rx="14" fill="url(#key)"/>
  <rect x="228" y="262" width="144" height="32" rx="16" fill="#FFFFFF" opacity="0.6"/>
  <rect x="100" y="340" width="72" height="44" rx="14" fill="url(#key)" opacity="0.7"/>
  <rect x="228" y="346" width="104" height="32" rx="16" fill="#FFFFFF" opacity="0.35"/>
  </g>
  </svg>
  <text x="440" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#FFFFFF">lecend</text>
  <text x="444" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#C7C9F5">What did W6 mean again? Ask without the model.</text>
  <text x="444" y="425" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#8E90C9">Session glossary for Claude Code · local · one Rust binary</text>
</svg>
